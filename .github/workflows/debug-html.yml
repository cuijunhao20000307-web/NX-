name: Debug GiriGiri HTML
on:
  push:
    branches:
      - build/nxanime-v01
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect homepage card HTML
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request
          html=urllib.request.urlopen('https://ani.girigirilove.com/',timeout=20).read().decode('utf-8','replace')
          for key in ['GV27100','GV27099','GV27114']:
              p=html.find(key)
              print('\n===',key,'pos',p,'===')
              if p>=0: print(html[max(0,p-1200):p+2200])
          PY
