name: Export Switch Build Toolchain

on:
  push:
    branches: [ nxanime-075-build ]
    paths:
      - '.github/workflows/export-devkit.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install NXAnime Switch portlibs
        shell: bash
        run: |
          set -euo pipefail
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --needed --noconfirm \
            switch-curl switch-freetype switch-libpng switch-libwebp \
            switch-sdl2 switch-ffmpeg switch-libjpeg-turbo
          pkg-config --modversion libcurl freetype2 libpng libwebp sdl2 libavformat libavcodec libavutil libswscale libswresample
      - name: Pack toolchain
        shell: bash
        run: |
          set -euo pipefail
          tar -C /opt -czf /tmp/devkitpro-switch-nxanime.tar.gz \
            devkitpro/devkitA64 \
            devkitpro/libnx \
            devkitpro/portlibs/switch \
            devkitpro/tools \
            devkitpro/switchvars.sh
          ls -lh /tmp/devkitpro-switch-nxanime.tar.gz
          sha256sum /tmp/devkitpro-switch-nxanime.tar.gz
          cp /tmp/devkitpro-switch-nxanime.tar.gz ./devkitpro-switch-nxanime.tar.gz
      - name: Upload toolchain
        uses: actions/upload-artifact@v4
        with:
          name: devkitpro-switch-nxanime
          path: devkitpro-switch-nxanime.tar.gz
          compression-level: 0
