name: Build WebEngine Test

on:
  workflow_dispatch:
  push:
    branches:
      - build/nxanime-v01
    paths:
      - '.github/workflows/build_webengine_test.yml'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch NetSurf Switch WebEngine
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/etonedemid/netsurf-switch.git /tmp/netsurf-switch
          test -f /tmp/netsurf-switch/netsurf/switch-dist/netsurf.nro
          ls -lh /tmp/netsurf-switch/netsurf/switch-dist/netsurf.nro

      - name: Package test NRO
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          cp /tmp/netsurf-switch/netsurf/switch-dist/netsurf.nro dist/NXAnime_WebEngine_Test.nro
          printf '%s\n' \
            'NXAnime WebEngine Test' \
            'Browser engine: NetSurf for Nintendo Switch + QuickJS' \
            'Upstream source: https://github.com/etonedemid/netsurf-switch' \
            'Upstream commit: c951bc34e6872c18ef85ade107129d46ea46d5d2' \
            'Purpose: validate normal public webpage and JavaScript compatibility on Switch.' \
            > dist/SOURCE.txt
          cp /tmp/netsurf-switch/netsurf/COPYING dist/COPYING || true

      - name: Upload WebEngine test
        uses: actions/upload-artifact@v4
        with:
          name: NXAnime-WebEngine-Test
          path: dist/
