name: School Stealth 3D v0.2 NRO isolated build
on:
  push:
    branches: [schoolstealth-3d-v02]
    paths: ['.github/schoolstealth_3d_src.dat','.github/workflows/schoolstealth-3d.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check transferred source archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib
          blob=Path('.github/schoolstealth_3d_src.dat').read_bytes()
          prefix=blob[:3072]
          s=Path('.github/schoolstealth_3d_tail_0.b64').read_text().strip()+Path('.github/schoolstealth_3d_tail_1.b64').read_text().strip()
          wanted="1acb497e5329f796121c49396e0f55f366f7859c7845622028168c0f1c05a946"
          print('prefix bytes:',len(prefix),'tail chars:',len(s),flush=True)
          assert len(prefix)==3072 and len(s)==7291
          for pos in range(4000,5001):
              for ch in "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/":
                  try: suffix=base64.b64decode(s[:pos]+ch+s[pos:],validate=True)
                  except Exception: continue
                  if len(suffix)==5468 and hashlib.sha256(prefix+suffix).hexdigest()==wanted:
                      Path('source.tar.xz').write_bytes(prefix+suffix)
                      print('verified source:',len(prefix+suffix),'bytes; repaired char at',pos,flush=True)
                      raise SystemExit(0)
          raise SystemExit('cannot reconstruct verified source archive')
          PY
          mkdir -p BuildSchoolStealth3D
          tar -xJf source.tar.xz -C BuildSchoolStealth3D
      - name: Compile NRO with devkitA64 and libnx
        shell: bash
        run: |
          set -euo pipefail
          export DEVKITPRO=/opt/devkitpro
          export PATH=/opt/devkitpro/devkitA64/bin:/opt/devkitpro/tools/bin:$PATH
          make -C BuildSchoolStealth3D -j2
          test -s BuildSchoolStealth3D/SchoolStealth3D.nro
      - name: Verify NRO and commit isolated binary
        shell: bash
        run: |
          set -euo pipefail
          magic="$(od -An -tx1 -j 16 -N 4 BuildSchoolStealth3D/SchoolStealth3D.nro | tr -d ' \n')"
          test "$magic" = "4e524f30"
          cp BuildSchoolStealth3D/SchoolStealth3D.nro SchoolStealth3D_v0.2.nro
          sha256sum SchoolStealth3D_v0.2.nro
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f SchoolStealth3D_v0.2.nro
          git commit -m "CI build original 3D school demo v0.2 [skip ci]"
          git push origin HEAD:schoolstealth-3d-v02
