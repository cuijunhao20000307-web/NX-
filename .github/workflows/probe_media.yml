name: Probe GiriGiri Media

on:
  push:
    branches:
      - build/nxanime-v01
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public episode pages
        shell: bash
        run: |
          set +e
          UA='Mozilla/5.0 (Nintendo Switch; NXAnime) AppleWebKit/605.1.15 Version/17.0 Safari/605.1.15'
          for URL in \
            'https://ani.girigirilove.com/playGV199-1-1/' \
            'https://ani.girigirilove.com/playGV1786-1-1/'
          do
            echo "=== $URL ==="
            curl -L -sS --max-time 20 -A "$UA" -e 'https://ani.girigirilove.com/' "$URL" -o /tmp/play.html
            echo "bytes=$(wc -c </tmp/play.html)"
            grep -oE 'player_aaaa[^<]{0,2500}' /tmp/play.html | head -2 || true
            grep -oE 'https?[^"'"'"' <>]+\.(m3u8|mp4)(\?[^"'"'"' <>]*)?' /tmp/play.html | head -10 || true
            grep -oE '"encrypt"[[:space:]]*:[[:space:]]*[0-9]+' /tmp/play.html | head -5 || true
          done
          exit 0
