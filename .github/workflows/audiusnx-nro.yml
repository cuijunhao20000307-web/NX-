name: NetEase Switch Beta 4 NRO build
on:
  push:
    branches:
      - audiusnx-build
    paths:
      - 'audiusnx/**'
      - '.github/workflows/audiusnx-nro.yml'
  workflow_dispatch:
jobs:
  nro:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Restore isolated NetEase Beta 4 sources
        run: |
          mkdir -p audiusnx/work
          base64 -d audiusnx/source.tar.xz.b64 | tar -xJf - -C audiusnx/work
          test -s audiusnx/work/source/main.cpp
          test -s audiusnx/work/Makefile
          grep -q 'netease::getTracks' audiusnx/work/source/main.cpp
      - name: Install Switch SDL and HTTPS dependencies
        run: |
          for attempt in 1 2 3 4; do
            if dkp-pacman -Sy --noconfirm --needed switch-sdl2 switch-sdl2_ttf switch-sdl2_image switch-sdl2_mixer switch-curl switch-mbedtls switch-libpng switch-freetype switch-libjpeg-turbo; then
              exit 0
            fi
            echo "devkitPro mirror retry ${attempt}/4"
            sleep 7
          done
          exit 1
      - name: Build Switch NRO
        run: |
          cd audiusnx/work
          make -j2
          test -s AudiusNX.nro
      - name: Verify NRO file
        run: |
          test -s audiusnx/work/AudiusNX.nro
          od -An -tx1 -j 16 -N 4 audiusnx/work/AudiusNX.nro
          sha256sum audiusnx/work/AudiusNX.nro
          ls -lh audiusnx/work/AudiusNX.nro
      - name: Upload NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeteaseNX-Beta4-NRO-unverified
          path: audiusnx/work/AudiusNX.nro
          if-no-files-found: error
