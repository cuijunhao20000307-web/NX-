name: NetEase Switch Beta 4 NRO build
on:
  push:
    branches:
      - audiusnx-build
    paths:
      - 'audiusnx/**'
      - '.github/workflows/audiusnx-nro.yml'
  workflow_dispatch:
jobs:
  nro:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Restore isolated NetEase Beta 4 sources
        run: |
          mkdir -p audiusnx/work
          base64 -d audiusnx/source.tar.xz.b64 | tar -xJf - -C audiusnx/work
          test -s audiusnx/work/source/main.cpp
          test -s audiusnx/work/Makefile
          grep -q 'netease::getTracks' audiusnx/work/source/main.cpp
      - name: Verify bundled SDL2 and HTTPS portlibs
        run: |
          export PKG_CONFIG_PATH=/opt/devkitpro/portlibs/switch/lib/pkgconfig
          export PKG_CONFIG_LIBDIR=/opt/devkitpro/portlibs/switch/lib/pkgconfig
          command -v aarch64-none-elf-g++
          /opt/devkitpro/portlibs/switch/bin/aarch64-none-elf-pkg-config --modversion sdl2 SDL2_ttf SDL2_image SDL2_mixer libcurl || true
          ls -l /opt/devkitpro/portlibs/switch/lib/libSDL2*.a /opt/devkitpro/portlibs/switch/lib/libcurl.a
      - name: Build Switch NRO
        run: |
          cd audiusnx/work
          make -j2
          test -s AudiusNX.nro
      - name: Verify NRO file
        run: |
          test -s audiusnx/work/AudiusNX.nro
          od -An -tx1 -j 16 -N 4 audiusnx/work/AudiusNX.nro
          sha256sum audiusnx/work/AudiusNX.nro
          ls -lh audiusnx/work/AudiusNX.nro
      - name: Upload NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeteaseNX-Beta4-NRO-unverified
          path: audiusnx/work/AudiusNX.nro
          if-no-files-found: error
