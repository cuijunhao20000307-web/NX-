name: Build NXFlix Native NRO

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - build/nxflix-native-v2

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          make -j2
          ls -lh NXFlixNative.nro
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp NXFlixNative.nro dist/NXFlixNative.nro
      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: NXFlixNative-v2
          path: dist/
