name: Build NXAnime NRO

on:
  workflow_dispatch:
  push:
    branches:
      - build/nxanime-v01

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
      PKG_CONFIG_LIBDIR: /opt/devkitpro/portlibs/switch/lib/pkgconfig
    steps:
      - uses: actions/checkout@v4

      - name: Install Switch libraries and wiliwili libmpv
        shell: bash
        run: |
          dkp-pacman --noconfirm -S switch-curl switch-freetype switch-zlib switch-libpng switch-libjpeg-turbo switch-libwebp switch-mesa switch-liblua51
          BASE_URL="https://github.com/xfangfang/wiliwili/releases/download/v0.1.0"
          curl -L --fail -o /tmp/switch-ffmpeg.pkg.tar.zst "$BASE_URL/switch-ffmpeg-7.1-1-any.pkg.tar.zst"
          curl -L --fail -o /tmp/switch-libmpv.pkg.tar.zst "$BASE_URL/switch-libmpv-0.36.0-3-any.pkg.tar.zst"
          dkp-pacman -U --noconfirm /tmp/switch-ffmpeg.pkg.tar.zst /tmp/switch-libmpv.pkg.tar.zst
          pkg-config --modversion mpv

      - name: Apply patches
        shell: bash
        run: |
          python nxanime_source/patch_v031.py
          python nxanime_source/patch_v032.py
          python nxanime_source/patch_v033.py
          python nxanime_source/patch_v034.py
          python nxanime_source/patch_v035.py
          python nxanime_source/patch_v036.py
          python nxanime_source/patch_v037.py
          python nxanime_source/patch_v038.py
          python nxanime_source/patch_v039.py
          python nxanime_source/patch_v040.py
          python nxanime_source/patch_v041.py
          python nxanime_source/patch_v042.py
          python nxanime_source/patch_v050.py

      - name: Build
        shell: bash
        run: |
          make clean
          make -j2
          ls -lh NXAnime.nro

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp NXAnime.nro dist/NXAnime.nro

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: NXAnime-v0.5.0-libmpv
          path: dist/
