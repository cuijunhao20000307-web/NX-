name: Probe GiriGiri Search

on:
  workflow_dispatch:
  push:
    branches:
      - build/nxanime-v01

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect current search form
        shell: bash
        run: |
          curl -L -sS --max-time 20 -A 'Mozilla/5.0' 'https://ani.girigirilove.com/' -o /tmp/home.html
          echo '--- FORM TAGS ---'
          grep -oE '<form[^>]*>' /tmp/home.html | head -30 || true
          echo '--- WD CONTEXT ---'
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/home.html').read_text(errors='ignore')
          for key in ['name="wd"', "name='wd'", 'search', 'vod/search', '/search/']:
              print('\nKEY', key)
              p=0
              n=0
              while True:
                  i=s.find(key,p)
                  if i<0 or n>=10: break
                  print(s[max(0,i-220):i+320].replace('\n',' '))
                  p=i+len(key);n+=1
          PY
          echo '--- JS URL CANDIDATES ---'
          grep -oE 'https?://[^"'"' ]+|/[A-Za-z0-9_./?=&-]*search[A-Za-z0-9_./?=&-]*' /tmp/home.html | sort -u | head -80 || true
