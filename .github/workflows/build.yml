name: Probe GiriGiri Search

on:
  workflow_dispatch:
  push:
    branches:
      - build/nxanime-v01

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect search javascript
        shell: bash
        run: |
          set +e
          curl -L -sS --max-time 20 -A 'Mozilla/5.0' 'https://ani.girigirilove.com/template/dsn2/static/js/script.js?version=4878' -o /tmp/script.js
          echo "JS_BYTES=$(wc -c </tmp/script.js)"
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/script.js').read_text(errors='ignore')
          for key in ['searchInputConvert','mac_wd','search-input-sub','/search/','search_auto']:
              print('\n===', key, '===')
              p=0;n=0
              while True:
                  i=s.find(key,p)
                  if i<0 or n>=12: break
                  print(s[max(0,i-700):i+1200].replace('\n',' '))
                  p=i+len(key);n+=1
          PY
          exit 0
