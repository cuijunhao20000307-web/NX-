name: Probe GiriGiri Search

on:
  workflow_dispatch:
  push:
    branches:
      - build/nxanime-v01

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe ajax suggest
        shell: bash
        run: |
          set +e
          UA='Mozilla/5.0 (Nintendo Switch; NXAnime) AppleWebKit/605.1.15 Version/17.0 Safari/605.1.15'
          for URL in \
            'https://ani.girigirilove.com/index.php/ajax/suggest?mid=1&wd=%E4%B8%9C%E4%BA%AC' \
            'https://ani.girigirilove.com/index.php/ajax/suggest?mid=1&wd=%E9%AC%BC%E7%81%AD' \
            'https://ani.girigirilove.com/index.php/ajax/suggest?mid=1&wd=%E8%BE%89%E5%A4%9C'
          do
            echo "=== $URL ==="
            curl -L -sS --max-time 20 -A "$UA" -e 'https://ani.girigirilove.com/' "$URL" -o /tmp/r
            echo "bytes=$(wc -c </tmp/r)"
            head -c 2500 /tmp/r; echo
          done
          exit 0
