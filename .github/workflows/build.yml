name: Probe GiriGiri Search

on:
  workflow_dispatch:
  push:
    branches:
      - build/nxanime-v01

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe SEO search route
        shell: bash
        run: |
          set +e
          UA='Mozilla/5.0 (Nintendo Switch; NXAnime) AppleWebKit/605.1.15 Version/17.0 Safari/605.1.15'
          curl -L -sS --max-time 20 -A "$UA" -c /tmp/c -b /tmp/c 'https://ani.girigirilove.com/' -o /tmp/home.html
          for URL in \
            'https://ani.girigirilove.com/search/-------------/?wd=%E4%B8%9C%E4%BA%AC' \
            'https://ani.girigirilove.com/search/%E4%B8%9C%E4%BA%AC-------------/' \
            'https://ani.girigirilove.com/search/%E6%9D%B1%E4%BA%AC-------------/'
          do
            echo "=== $URL ==="
            curl -L -sS --max-time 20 -A "$UA" -e 'https://ani.girigirilove.com/' -c /tmp/c -b /tmp/c "$URL" -o /tmp/r.html
            echo "bytes=$(wc -c </tmp/r.html) gv=$(grep -o 'GV[0-9]\+' /tmp/r.html | sort -u | wc -l)"
            grep -o '系统提示\|非法请求\|东京[^<]*\|東京[^<]*' /tmp/r.html | head -10
          done
          exit 0
