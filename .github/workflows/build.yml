name: Build NXTitleStudio NRO

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
    steps:
      - name: Recreate source
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/NXTitleStudio_payload.tar.gz
          tar -xzf /tmp/NXTitleStudio_payload.tar.gz
      - name: Fetch dependencies
        shell: bash
        run: |
          cd NXTitleStudio
          chmod +x fetch_deps.sh
          ./fetch_deps.sh
      - name: Build NRO
        shell: bash
        run: |
          cd NXTitleStudio
          make -j2
          ls -lh NXTitleStudio.nro
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp NXTitleStudio/NXTitleStudio.nro dist/NXTitleStudio.nro
          cp NXTitleStudio/README_CN.md dist/README_CN.md
      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: NXTitleStudio-NRO
          path: dist/
