name: Build NXTitleStudio NRO

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
    steps:
      - uses: actions/checkout@v4
      - name: Prepare app icon, game icons and Switch editor
        shell: bash
        run: |
          base64 -d app_icon.b64 > icon.jpg
          python3 tools/patch_game_icons.py
          python3 tools/patch_unchanged_fields.py
          python3 tools/patch_switch_text_editor.py
      - name: Fetch dependencies
        shell: bash
        run: |
          chmod +x fetch_deps.sh
          ./fetch_deps.sh
      - name: Prepare app metadata
        shell: bash
        run: |
          base64 -d icon.jpg.b64 > icon.jpg
          sed -i 's/A  手机编辑/A  本机修改/g' source/ui.cpp
          sed -i 's/A 手机编辑/A 本机修改/g' source/ui.cpp
          sed -i 's/X 恢复覆盖/Y 手机图标\/网页     X 恢复覆盖/g' source/ui.cpp
          sed -i 's/NX标题工坊 0.2.1/NX标题工坊 0.2.2/g' source/ui.cpp
      - name: Build NRO
        shell: bash
        run: |
          make -j2
          ls -lh NXTitleStudio.nro
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp NXTitleStudio.nro dist/NX标题工坊.nro
          cp README_CN.md dist/README_CN.md
      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: NX标题工坊-NRO
          path: dist/
