name: Build NXAnime NRO

on:
  workflow_dispatch:
  push:
    branches:
      - build/nxanime-v01

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
      PKG_CONFIG_LIBDIR: /opt/devkitpro/portlibs/switch/lib/pkgconfig
    steps:
      - uses: actions/checkout@v4

      - name: Install Switch libraries
        shell: bash
        run: |
          dkp-pacman --noconfirm -S switch-curl switch-freetype switch-zlib switch-libpng switch-libjpeg-turbo switch-libwebp
          pkg-config --modversion libcurl
          pkg-config --modversion freetype2
          pkg-config --modversion libpng
          pkg-config --modversion libwebp

      - name: Apply v0.3.1 fixes
        shell: bash
        run: |
          python nxanime_source/patch_v031.py

      - name: Apply v0.3.2 search fixes
        shell: bash
        run: |
          python nxanime_source/patch_v032.py

      - name: Apply v0.3.3 input fixes
        shell: bash
        run: |
          python nxanime_source/patch_v033.py

      - name: Apply v0.3.4 filter fixes
        shell: bash
        run: |
          python nxanime_source/patch_v034.py

      - name: Apply v0.3.5 search return fixes
        shell: bash
        run: |
          python nxanime_source/patch_v035.py

      - name: Build
        shell: bash
        run: |
          make clean
          make -j2
          ls -lh NXAnime.nro

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp NXAnime.nro dist/NXAnime.nro

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: NXAnime-v0.3.5-searchfix
          path: dist/
