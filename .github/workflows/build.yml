name: Build NXFlix NRO

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
    steps:
      - uses: actions/checkout@v4
      - name: Build NXFlix
        shell: bash
        run: |
          make -j2
          ls -lh NXFlixWeb.nro
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp NXFlixWeb.nro dist/NXFlixWeb_v1.1.0.nro
      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: NXFlix-v1.1.0
          path: dist/NXFlixWeb_v1.1.0.nro
